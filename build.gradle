plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.wonder.music'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wonder.music'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // A fixed debug key. Without it every CI build is signed with a brand-new random key, so the
    // SHA-1 you register in Google Cloud would stop matching after the next build and Google
    // sign-in would fail. Keep zuno-debug.keystore committed next to this file.
    signingConfigs {
        debug {
            storeFile file('zuno-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}

dependencies {
    // Native "Sign in with Google" account picker (Credential Manager)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
